# Render Blueprint (optional). Untested: I could not deploy from my sandbox.
# You can also create the service by hand in the Render dashboard (see README).
services:
  - type: web
    name: velnor-studio
    runtime: node
    plan: free
    buildCommand: echo "No build step needed"
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
